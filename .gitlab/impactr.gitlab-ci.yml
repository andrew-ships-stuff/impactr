impactr:
  stage: test
  image: golang:1.24-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    IMPACTR_PROVIDER: "none"
  before_script:
    - go install github.com/andrew-ships-stuff/impactr/cmd/impactr@${IMPACTR_VERSION:-latest}
  script:
    - impactr analyze --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --output .impactr
    - |
      if [ -n "$GITLAB_TOKEN" ]; then
        impactr gitlab comment --mr "$CI_MERGE_REQUEST_IID" --project "$CI_PROJECT_ID" --output .impactr
      else
        echo "GITLAB_TOKEN absent; artifacts generated without a merge-request comment"
      fi
  artifacts:
    when: always
    paths: [.impactr/]
    expire_in: 14 days
